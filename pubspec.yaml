name: expense
description: "A Flutter expense tracking application with local-first architecture"
publish_to: 'none'
version: 1.5.1

environment:
  sdk: ^3.10.0

dependencies:
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  hydrated_bloc: ^9.1.5
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.7

  # Routing
  go_router: ^14.6.2

  # Local Storage
  path_provider: ^2.1.5
  path: ^1.9.1

  # Backend & Sync (InstantDB owns local cache + realtime sync)
  flutter_instantdb: ^2.2.2

  # Internationalization
  easy_localization: ^3.0.7
  intl: 0.20.2

  # Environment Configuration
  flutter_dotenv: ^6.0.1

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Utilities
  flutter_svg: ^2.0.14
  fl_chart: ^0.70.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  logger: ^2.5.0
  uuid: ^4.5.1
  collection: ^1.19.0
  google_fonts: ^7.0.2
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  flutter_animate: ^4.5.2
  pinput: ^6.0.2
  flutter_native_splash: ^2.4.7
  marionette_flutter: ^0.3.0
  flutter_secure_storage: ^11.2.0
  cupertino_icons: ^1.0.9
  flutter_web_auth_2: ^5.1.0
  image_picker: ^1.2.4
  file_picker: ^13.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  sqflite_common_ffi: ^2.4.0+3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Flavor Management
  flutter_flavorizr: ^2.2.3

  # Assets
  flutter_launcher_icons: ^0.14.2

flutter:
  default-flavor: dev
  uses-material-design: true
  
  assets:
    - assets/translations/
    - assets/images/
    - assets/icon/
    - assets/fonts/
    - .env.dev
    - .env.prod

# Flavor Configuration
flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:
      name: "G-spend"

  flavors:
    dev:
      app:
        name: "G-spend Dev"
      android:
        applicationId: "ts.mila.expense.dev"
      ios:
        bundleId: "ts.mila.expense.dev"
    
    prod:
      app:
        name: "G-spend"
      android:
        applicationId: "ts.mila.expense"
      ios:
        bundleId: "ts.mila.expense"

# Launcher Icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

dependency_overrides:
  flutter_instantdb:
    path: packages/flutter_instantdb
