<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>G-spend — deux directions</title><style>
@import url('https://fonts.googleapis.com/css2?family=ABeeZee&display=swap');
:root{--background:#fff;--foreground:#18221c;--muted:#718078;--card:#fff;--border:#dee4df;--primary:#157348;--radius:16px;--font-sans:ABeeZee,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #62b993;outline-offset:3px}button{transition:transform .15s,background .2s}button:active{transform:scale(.97)}.controls{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 20px}.controls button{padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--foreground)}.controls button.active{background:var(--primary);color:white;border-color:var(--primary)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.caption{font:14px var(--font-sans);margin:0 0 12px}.caption strong{display:block;font-size:18px;margin-bottom:6px}.phone{--bg:#fff;--fg:#181d1a;--soft:#f5f6f5;--line:#e4e7e5;--dim:#66716a;--accent:#167449;--tint:#eaf4ee;position:relative;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:24px;overflow:hidden;min-width:0;height:740px;display:flex;flex-direction:column}.phone.dark{--bg:#141916;--fg:#edf3ee;--soft:#202923;--line:#344139;--dim:#a7b5ab;--tint:#273f31;--accent:#218858}.expressive{--bg:#f3f6ec;--soft:#e8eedf;--line:#d5decc;--tint:#d7edbe;--accent:#35652a}.expressive.dark{--bg:#151d13;--soft:#263022;--tint:#364d29;--accent:#426f34}.status{padding:14px 22px 4px;display:flex;justify-content:space-between;font:12px Arial;flex-shrink:0}.status svg{width:30px;height:12px}header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;gap:8px}header strong{font-size:21px;letter-spacing:-.8px}button.icon{border:0;background:transparent;color:inherit;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:13px}.tools{display:flex;align-items:center;gap:4px}.view{padding:0 20px 20px;overflow:auto;flex:1;animation:enter .2s ease-out}.context{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px;font-size:13px;color:var(--dim)}.context select{max-width:145px;color:inherit;border:0;background:transparent;padding:8px 0}.balance{border:1px solid var(--line);border-radius:10px;padding:20px}.label{font-size:13px;color:var(--dim)}.money{font-size:32px;letter-spacing:-1.5px;margin:12px 0 20px;white-space:nowrap}.money small{font-size:15px;letter-spacing:0;color:var(--dim)}.summary{display:flex;gap:20px}.summary div{flex:1;font-size:14px;line-height:1.8}.summary span{display:block;font-size:12px;color:var(--dim)}.primary{background:var(--accent);color:#fff;border:0;padding:14px 18px;min-height:48px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px}.add{width:100%;margin:14px 0 26px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 8px}.section-title h2{font-size:16px;font-weight:400;margin:0}.link{background:none;border:0;color:var(--accent);font-size:12px;padding:10px 0}.dark .link{color:#a5d9b7}.row{width:100%;display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);padding:14px 0;background:none;color:inherit;text-align:left}.tile{width:40px;height:40px;flex-shrink:0;background:var(--soft);border-radius:8px;display:grid;place-items:center}.detail{flex:1;font-size:14px;line-height:1.6}.detail small{display:block;font-size:12px;color:var(--dim)}.amount{font-size:13px;white-space:nowrap}.budget{padding:15px 0;font-size:13px}.budget-top{display:flex;justify-content:space-between;margin-bottom:12px}.track{height:6px;background:var(--soft);border-radius:20px;overflow:hidden}.track i{display:block;width:63%;height:100%;background:var(--accent)}nav{display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:10px 4px 20px;flex-shrink:0}nav button{flex:1;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);background:none;border:0;padding:0}nav .nav-icon{height:32px;width:54px;display:grid;place-items:center;border-radius:6px}nav button.selected{color:var(--fg)}nav button.selected .nav-icon{background:var(--tint);color:var(--accent)}.expressive header{padding-top:20px}.expressive .balance{border:0;border-radius:28px;background:var(--tint);padding:24px}.expressive .money{font-size:34px;margin:14px 0 24px}.expressive .summary{padding-top:14px;border-top:1px solid color-mix(in srgb,var(--fg) 15%,transparent)}.expressive .primary{border-radius:24px;min-height:54px}.expressive .add{width:auto;margin:16px 0 24px auto;padding-inline:24px;border-radius:18px}.expressive .row{background:var(--soft);border:0;padding:13px 12px;margin:3px 0;border-radius:7px}.expressive .rows .row:first-child{border-radius:20px 20px 7px 7px}.expressive .rows .row:last-child{border-radius:7px 7px 20px 20px}.expressive .tile{background:var(--bg);border-radius:50%}.expressive nav{background:var(--soft);border:0;padding-top:12px}.expressive nav .nav-icon{border-radius:30px;width:60px}.expressive nav button.selected .nav-icon{background:var(--tint)}.expressive nav button.selected{font-weight:bold}.expressive .track{height:10px}.expressive .budget{padding:16px;background:var(--soft);border-radius:20px;margin-top:16px}.overlay{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:5}.sheet{background:var(--bg);width:100%;padding:20px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;animation:rise .25s ease-out}.expressive .sheet{border-radius:32px 32px 0 0}.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.sheet h2{font-size:19px;font-weight:400;margin:0}.sheet label{font-size:13px;display:block;margin:18px 0 8px}.sheet input,.sheet select{width:100%;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--fg);font-size:16px}.sheet .primary{margin-top:24px;width:100%}.attach{display:flex;flex-wrap:wrap;gap:6px}.attach button{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;color:inherit;font-size:12px}.note{font-size:12px;color:var(--dim);line-height:1.6}.bars{height:150px;display:flex;align-items:flex-end;gap:10px;padding:20px 0}.bars i{flex:1;background:var(--accent);border-radius:5px 5px 0 0}.view h1{font-size:24px;font-weight:400;margin:10px 0 22px}.expressive .view h1{font-size:28px}.saved{color:var(--accent);font-size:13px;margin-top:10px}.hidden{display:none}@keyframes enter{from{opacity:.6}to{opacity:1}}@keyframes rise{from{transform:translateY(35px);opacity:.6}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:600px){.grid{grid-template-columns:1fr}.phone{height:730px}.caption{margin-top:6px}}@media(min-width:601px){.grid.single{grid-template-columns:minmax(0,390px);justify-content:center}}
header .page-title{font-size:22px;letter-spacing:-.5px;font-weight:400}.expressive header .page-title{font-size:26px}.page-context{font-size:12px;color:var(--dim);margin:0 0 16px}.overlay{align-items:stretch;background:var(--bg)}.sheet,.expressive .sheet{border-radius:0;max-height:none;padding-top:22px}.sheet-top{min-height:48px;border-bottom:1px solid var(--line);padding-bottom:12px}.search{width:100%;padding:12px;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:10px;margin-bottom:16px}.period{padding:9px 4px;border:0;background:transparent;color:var(--fg);font-size:12px;max-width:120px}.expressive .period{background:var(--soft);border-radius:20px;padding:10px}.view{padding-top:8px}
/* One title style across the brand, pages and forms. */
.phone header strong,.phone header .page-title,.expressive header .page-title,.phone .sheet h2,.phone .view h1{font-family:var(--font-sans);font-size:21px;font-weight:700;letter-spacing:-.8px;line-height:1.25}
/* Selects use the same typography as normal content text. */
.phone select,.phone select option,.expressive .period{font-family:var(--font-sans);font-size:14px;font-weight:400;letter-spacing:normal;line-height:1.6}
.phone .context select{max-width:165px}.phone .period{max-width:155px}
/* Keep expense creation reachable without interrupting the content. */
.phone .view>.add{display:none}
.phone .quick-add{position:absolute;right:18px;bottom:96px;z-index:2;width:54px;height:54px;padding:0;border-radius:16px;box-shadow:0 4px 12px #0002}
.phone .quick-add svg{width:25px;height:25px}
.expressive .quick-add{width:60px;height:60px;border-radius:20px}
.phone .view{padding-bottom:90px}
.phone:has(.quick-add) .view{margin-bottom:72px;padding-bottom:20px}</style><body><div class="controls" aria-label="Comparaison"><button class="active" onclick="choose('both',this)">Comparer</button><button onclick="choose('a',this)">A · Sobre</button><button onclick="choose('b',this)">B · Expressif</button></div><div class="grid" id="grid"></div><script>
const icons={home:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',activity:'<path d="M7 3v17m-4-4 4 4 4-4M17 21V4m-4 4 4-4 4 4"/>',stats:'<path d="M5 20V12m7 8V4m7 16V8"/>',folder:'<path d="M3 7V5h6l2 3h10v12H3z"/>',plus:'<path d="M12 5v14M5 12h14"/>',bag:'<rect x="4" y="7" width="16" height="14" rx="3"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>',car:'<path d="m5 8 2-4h10l2 4 2 3v7H3v-7zM3 11h18M6 15h2m8 0h2M5 18v3m14-3v3"/>',moon:'<path d="M20 15A8 8 0 0 1 9 4a8 8 0 1 0 11 11z"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.bag)+'</svg>';let data={a:{tab:0,dark:false,extra:[]},b:{tab:2,dark:false,extra:[]}};
const tx=[['Courses du marché','Alimentation · Aujourd’hui','− 85 000 Ar','bag'],['Taxi','Transport · Aujourd’hui','− 12 000 Ar','car'],['Internet','Maison · Hier','− 150 000 Ar','home']];
function rows(id){return '<div class="rows">'+[...data[id].extra,...tx].map(t=>'<button class="row" onclick="details(&quot;'+id+'&quot;,this)"><span class="tile">'+icon(t[3])+'</span><span class="detail">'+t[0]+'<small>'+t[1]+'</small></span><span class="amount">'+t[2]+'</span></button>').join('')+'</div>'}
function content(id){let t=data[id].tab;if(t===0)return '<div class="context"><select aria-label="Espace"><option>Espace personnel</option><option>Trano</option></select><span>Novembre 2026</span></div><section class="balance"><div class="label">Disponible ce mois</div><div class="money">1 875 000 <small>Ar</small></div><div class="summary"><div><span>↙ Revenus</span>2 400 000 Ar</div><div><span>↗ Dépenses</span>525 000 Ar</div></div></section><button class="primary add" onclick="add(&quot;'+id+'&quot;)">'+icon('plus')+'Ajouter une dépense</button><div class="section-title"><h2>Dernières opérations</h2><button class="link" onclick="tab(&quot;'+id+'&quot;,1)">Tout voir</button></div>'+rows(id)+'<div class="budget"><div class="budget-top"><span>Budget du mois</span><span>63 % disponible</span></div><div class="track"><i></i></div></div>';
if(t===1)return '<div class="context"><span>Novembre 2026</span><span>Historique</span></div>'+rows(id)+'<button class="primary add" onclick="add(&quot;'+id+'&quot;)">'+icon('plus')+'Ajouter une dépense</button>';
if(t===2)return '<div class="context">Novembre 2026</div><section class="balance"><div class="label">Total des dépenses</div><div class="money">525 000 <small>Ar</small></div><div class="bars">'+[35,68,44,90,57,76,48].map(h=>'<i style="height:'+h+'%"></i>').join('')+'</div><div class="note">Dépenses par jour · données de démonstration</div></section><div class="section-title"><h2>Par catégorie</h2></div><div class="budget">Maison · 285 000 Ar</div><div class="budget">Alimentation · 180 000 Ar</div><div class="budget">Transport · 60 000 Ar</div>';
return '<p class="note">Un espace pour chaque budget.</p><div class="rows">'+['Espace personnel','Trano'].map(n=>'<button class="row" onclick="project(&quot;'+id+'&quot;,&quot;'+n+'&quot;)"><span class="tile">'+icon('folder')+'</span><span class="detail">'+n+'<small>Voir les opérations</small></span><span>→</span></button>').join('')+'</div>'}
function pageHeader(id){let t=data[id].tab;if(t===0)return '<strong>G-spend</strong><div class="tools"><button class="icon" aria-label="Changer le thème" onclick="theme(&quot;'+id+'&quot;)">'+icon('moon')+'</button><button class="icon" aria-label="Compte" onclick="account(&quot;'+id+'&quot;)"><span class="avatar">T</span></button></div>';let actions=t===1?'<button class="icon" aria-label="Rechercher" onclick="search(&quot;'+id+'&quot;)"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button><button class="icon" aria-label="Filtres" onclick="filters(&quot;'+id+'&quot;)"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>':t===2?'<select class="period" aria-label="Période" onchange="period(&quot;'+id+'&quot;,this.value)"><option>Novembre 2026</option><option>Octobre 2026</option></select>':'<button class="icon" aria-label="Créer un projet" onclick="newProject(&quot;'+id+'&quot;)">'+icon('plus')+'</button>';return '<strong class="page-title">'+['','Activité','Analyse','Projets'][t]+'</strong><div class="tools">'+actions+'</div>'}
function render(id){let d=data[id],root=document.getElementById(id);root.className='phone '+(id==='b'?'expressive ':'')+(d.dark?'dark':'');root.innerHTML='<div class="status"><span>9:41</span><span>▮▮▮ &nbsp; ▰</span></div><header>'+pageHeader(id)+'</header><main class="view">'+content(id)+'</main>'+(d.tab===0||d.tab===1?'<button class="primary quick-add" aria-label="Nouvelle dépense" title="Nouvelle dépense" onclick="add(&quot;'+id+'&quot;)">'+icon('plus')+'</button>':'')+'<nav aria-label="Navigation principale">'+['Accueil','Activité','Analyse','Projets'].map((n,i)=>'<button class="'+(i===d.tab?'selected':'')+'" aria-current="'+(i===d.tab?'page':'false')+'" onclick="tab(&quot;'+id+'&quot;,'+i+')"><span class="nav-icon">'+icon(['home','activity','stats','folder'][i])+'</span>'+n+'</button>').join('')+'</nav>'}
function account(id){sheet(id,'Compte','<p>Profil de démonstration</p><button class="primary" onclick="theme(&quot;'+id+'&quot;)">Changer le thème</button>')}
function search(id){let view=document.querySelector('#'+id+' .view');if(view.querySelector('.search')){view.querySelector('.search').focus();return}view.insertAdjacentHTML('afterbegin','<input class="search" placeholder="Rechercher une opération" aria-label="Rechercher une opération" oninput="filterRows(&quot;'+id+'&quot;,this.value)">');view.querySelector('.search').focus()}
function filterRows(id,value){document.querySelectorAll('#'+id+' .view .row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(value.toLowerCase()));document.querySelectorAll('#'+id+' .view .row').forEach(r=>r.style.display=r.hidden?'none':'flex')}
function filters(id){sheet(id,'Filtrer les opérations','<label>Catégorie</label><select id="filter-'+id+'"><option value="">Toutes les catégories</option>Alimentation</option><option>Transport</option><option>Maison</option></select><button class="primary" onclick="applyFilter(&quot;'+id+'&quot;)">Appliquer</button>')}
function applyFilter(id){let value=document.getElementById('filter-'+id).value;closeSheet(id);filterRows(id,value)}
function period(id,value){document.querySelector('#'+id+' .view .context').textContent=value;document.querySelector('#'+id+' .view .money').innerHTML=(value.startsWith('Octobre')?'480 000':'525 000')+' <small>Ar</small>'}
function newProject(id){sheet(id,'Nouveau projet','<form onsubmit="createProject(event,&quot;'+id+'&quot;)"><label>Nom du projet</label><input name="name" required placeholder="Ex. Vacances"><button class="primary">Créer le projet</button><p class="note">Maquette : ajout local uniquement.</p></form>')}
function createProject(e,id){e.preventDefault();let name=new FormData(e.target).get('name');closeSheet(id);let button=document.createElement('button');button.className='row';button.textContent=name;button.onclick=()=>project(id,name);document.querySelector('#'+id+' .view .rows').append(button)}
function tab(id,t){data[id].tab=t;render(id)}function theme(id){data[id].dark=!data[id].dark;render(id)}function closeSheet(id){document.querySelector('#'+id+' .overlay')?.remove();document.querySelectorAll('#'+id+' > header,#'+id+' > main,#'+id+' > nav,#'+id+' > .quick-add').forEach(e=>e.inert=false)}
function sheet(id,title,body){closeSheet(id);document.querySelectorAll('#'+id+' > header,#'+id+' > main,#'+id+' > nav,#'+id+' > .quick-add').forEach(e=>e.inert=true);document.getElementById(id).insertAdjacentHTML('beforeend','<div class="overlay" onclick="if(event.target===this)closeSheet(&quot;'+id+'&quot;)"><section class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="sheet-top"><h2>'+title+'</h2><button class="icon" aria-label="Fermer" onclick="closeSheet(&quot;'+id+'&quot;)">'+icon('close')+'</button></div>'+body+'</section></div>');document.querySelector('#'+id+' .sheet button').focus()}
function add(id){sheet(id,'Nouvelle dépense','<form onsubmit="save(event,&quot;'+id+'&quot;)"><label>Montant · Ar</label><input name="amount" type="number" min="1" required placeholder="0" inputmode="decimal"><label>Libellé</label><input name="note" required placeholder="Ex. Courses du marché"><label>Catégorie</label><select><option>Alimentation</option><option>Transport</option><option>Maison</option></select><label>Justificatif</label><div class="attach"><button type="button" onclick="pick(&quot;'+id+'&quot;,true)">Appareil photo</button><button type="button" onclick="pick(&quot;'+id+'&quot;,false)">Photo / fichier</button></div><input class="hidden" type="file" id="file-'+id+'" onchange="document.getElementById(&quot;filename-'+id+'&quot;).textContent=this.files[0]?.name||&quot;&quot;"><p class="note" id="filename-'+id+'"></p><button class="primary">Enregistrer</button><p class="note">Maquette : ajout local, aucun envoi au serveur.</p></form>')}
function pick(id,camera){let f=document.getElementById('file-'+id);if(camera){f.accept='image/*';f.setAttribute('capture','environment')}else{f.removeAttribute('capture');f.accept='image/*,.pdf'}f.click()}
function save(e,id){e.preventDefault();let f=new FormData(e.target),n=document.createElement('span');n.textContent=f.get('note');data[id].extra.unshift([n.innerHTML,'Aujourd’hui · Démonstration','− '+Number(f.get('amount')).toLocaleString('fr-FR')+' Ar','bag']);data[id].tab=1;render(id)}
function details(id,el){sheet(id,'Détail de la dépense','<p>'+el.querySelector('.detail').innerHTML+'</p><div class="money">'+el.querySelector('.amount').textContent+'</div><p class="note">Espace personnel · Aucun justificatif</p><button class="primary" onclick="closeSheet(&quot;'+id+'&quot;)">Fermer</button>')}
function project(id,n){let safe=document.createElement('span');safe.textContent=n;sheet(id,safe.innerHTML,'<p class="note">Opérations de cet espace · démonstration</p>'+rows(id))}
function choose(which,btn){document.querySelectorAll('.controls button').forEach(b=>b.classList.toggle('active',b===btn));document.getElementById('grid').classList.toggle('single',which!=='both');document.querySelectorAll('.proposal').forEach(el=>el.classList.toggle('hidden',which!=='both'&&el.dataset.id!==which))}
document.getElementById('grid').innerHTML=['a','b'].map((id,i)=>'<section class="proposal" data-id="'+id+'"><div class="caption"><strong>'+['A · Sobriété shadcn/ui','B · Material Expressive'][i]+'</strong>'+['Surfaces nettes · densité maîtrisée','Formes douces · surfaces teintées'][i]+'</div><div id="'+id+'"></div></section>').join('');render('a');render('b');document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet('a');closeSheet('b')}});
</script></body></html>
