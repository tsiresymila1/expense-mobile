</style><style>/*
  taste-skill motion.css - the micro-interactions a company site has (figma.com, x.ai): one small
  opt-in layer over system.css and ui/cards.css. Link it after them (data-motion on <html> is optional);
  load motion.js once (it adds the tab indicator, the number tick and the card loops).
  The layer is ON as soon as this file is linked: no attribute is needed (a hover shot of a linked card or photo
  shows the 2px lift and the 1.03 zoom). <html data-motion="off"> switches the whole layer off; data-motion="live"
  is the number tick in a headless shot (motion.js).
  references/motion.md says what moves and how fast. Everything here answers the pointer, the
  keyboard or a number coming into view once; nothing moves because the page scrolled.

  Hover rules sit under (hover: hover) and (pointer: fine): a phone never keeps a stuck hover.
  Under prefers-reduced-motion colours still change; nothing moves or scales.
*/

:root {
  --m-in: 140ms;                              /* hover in: buttons, links, nav, tabs */
  --m-out: 200ms;                             /* hover out, panel close */
  --m-press: 90ms;                            /* a press */
  --m-panel: 200ms;                           /* a menu or sheet opening */
  --m-slide: 240ms;                           /* an indicator travelling between two tabs or links */
  --m-image: 600ms;                           /* a photograph scaling inside its mask */
  --m-ease: cubic-bezier(.2, .8, .2, 1);      /* ease-out: fast start, soft landing */
  --m-ease-io: cubic-bezier(.65, 0, .35, 1);  /* the indicator: leaves and lands softly */
  --m-cycle: 3.2s;                            /* one cycle of a card's loop (2.5-4 s) */
  --m-lift: -2px;
}

/* ---------------------------------------------------------------- buttons */
html:not([data-motion="off"]) .btn {
  position: relative;
  transition: background-color var(--m-out) var(--m-ease), color var(--m-out) var(--m-ease),
              border-color var(--m-out) var(--m-ease), box-shadow var(--m-out) var(--m-ease),
              transform var(--m-press) var(--m-ease);
}
/* the tone moves toward the ground: a black button greys a little on white, a white one on black */
html:not([data-motion="off"]) .btn--primary:hover { background: color-mix(in oklab, var(--action) 84%, var(--bg)); }
html:not([data-motion="off"]) .btn--secondary:hover {
  background: color-mix(in oklab, var(--bg) 92%, var(--ink));
  border-color: color-mix(in oklab, var(--ink) 32%, transparent);
}
html:not([data-motion="off"]) .btn:hover { transition-duration: var(--m-in), var(--m-in), var(--m-in), var(--m-in), var(--m-press); }
html:not([data-motion="off"]) .btn:active { transform: translateY(1px) scale(.985); }
/* the step: a button rises 1px on hover (2px on the large size) and presses 1px down with a 1.5% shrink on
   click; pointer only. The text-link secondary (arrow and block looks) keeps its underline and does not step.
   Reduced motion keeps the colour change only (see the end of this file). */
@media (hover: hover) and (pointer: fine) {
  html:not([data-motion="off"]) .btn:hover { transform: translateY(-1px); }
  html:not([data-motion="off"]) .btn--xl:hover { transform: translateY(-2px); }
  html:not([data-motion="off"]):is([data-buttons="arrow"], [data-buttons="block"]) .btn--secondary:hover { transform: none; }
  html:not([data-motion="off"]) .btn:active { transform: translateY(1px) scale(.985); }
  html:not([data-motion="off"]):is([data-buttons="arrow"], [data-buttons="block"]) .btn--secondary:active { transform: scale(.985); }
}

/* the arrow: the text arrow (.btn--arrow, .link) nudges 3px; the drawn arrow (.m-arrow) grows its
   stem and moves its head 3px, the way a good product site's "Learn more" does */
html:not([data-motion="off"]) :is(.btn--arrow, .link)::after { transition: transform var(--m-out) var(--m-ease); }
html:not([data-motion="off"]) :is(.btn--arrow, .link):hover::after { transform: translateX(3px); transition-duration: var(--m-in); }
.m-arrow { width: 12px; height: 12px; flex: none; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.6;
           stroke-linecap: round; stroke-linejoin: round; }
.m-arrow__stem { opacity: 0; transform: scaleX(.2); transform-origin: 1px 50%; transform-box: fill-box;
                 transition: opacity var(--m-out) var(--m-ease), transform var(--m-out) var(--m-ease); }
.m-arrow__head { transition: transform var(--m-out) var(--m-ease); }
:is(a, button):hover > .m-arrow .m-arrow__stem,
:is(a, button):focus-visible > .m-arrow .m-arrow__stem { opacity: 1; transform: none; transition-duration: var(--m-in); }
:is(a, button):hover > .m-arrow .m-arrow__head,
:is(a, button):focus-visible > .m-arrow .m-arrow__head { transform: translateX(3px); transition-duration: var(--m-in); }

/* a pill that is a link (the line above a hero headline) */
html:not([data-motion="off"]) a.pill { transition: background-color var(--m-out) var(--m-ease), border-color var(--m-out) var(--m-ease); }
html:not([data-motion="off"]) a.pill:hover { background: color-mix(in oklab, var(--card) 90%, var(--ink)); border-color: var(--line-strong); transition-duration: var(--m-in); }

/* ---------------------------------------------------------------- links: an underline that draws */
/* .link and links in running text: a rest line, and the ink line draws left to right on hover and
   leaves to the right. A link in a sentence rests on its own colour at 45% (about 3.3:1 on its
   ground), so it reads as a link even when it is the same colour as the text (WCAG 1.4.1); .link
   and .m-link carry an arrow or sit alone and rest on the faint hairline */
html:not([data-motion="off"]) :is(.link, .m-link, p a:not([class]), .footer ul a, .footer .link) {
  text-decoration: none;
  background-image: linear-gradient(currentColor, currentColor), linear-gradient(var(--m-rest, var(--line-strong)), var(--m-rest, var(--line-strong)));
  background-repeat: no-repeat; background-size: 0% 1px, 100% 1px;
  background-position: right 0 bottom 0, 0 100%;
  transition: background-size var(--m-out) var(--m-ease), color var(--m-out) var(--m-ease);
  padding-bottom: 2px;
}
/* set on its own rule: the shared rule above is (0,3,1) through :is(.footer .link) and would win */
html:not([data-motion="off"]) p a:not([class]) { --m-rest: color-mix(in oklab, currentColor 45%, transparent); }
html:not([data-motion="off"]) :is(.footer ul a, .m-link--bare):not(:hover, :focus-visible) { background-size: 0% 1px, 0% 1px; }
html:not([data-motion="off"]) :is(.link, .m-link, p a:not([class]), .footer ul a, .footer .link):is(:hover, :focus-visible) {
  background-size: 100% 1px, 100% 1px; background-position: left 0 bottom 0, 0 100%; transition-duration: var(--m-in);
}
/* the link's arrow is not underlined: the line runs under the words only */
html:not([data-motion="off"]) .link { background-size: 0% 1px, calc(100% - 1em - var(--s-2)) 1px; }
html:not([data-motion="off"]) .link:is(:hover, :focus-visible) { background-size: calc(100% - 1em - var(--s-2)) 1px, calc(100% - 1em - var(--s-2)) 1px; }
html:not([data-motion="off"]) .link, html:not([data-motion="off"]) .link:is(:hover, :focus-visible) { background-position: 0 100%, 0 100%; }
html:not([data-motion="off"]) .footer ul a:hover { color: var(--ink); }

/* ---------------------------------------------------------------- navigation */
/* the nav words take no pill (ST-08, ST-11): system.css draws the underline under a word from the left on hover and focus, and
   takes it away to the right; the page you are on keeps its still bar (system.css draws it, at the same inset) */
@media (min-width: 1024px) {
  /* the full-width panel: fades and settles 6px in 200ms, its columns follow 30ms apart; it closes
     in 120ms. While one menu is open, the next word swaps the panel at once (motion.js .m-menu-open) */
  html:not([data-motion="off"]) .nav__menu {
    transform: translateY(-6px);
    transition: opacity 120ms var(--m-ease), transform 120ms var(--m-ease), visibility 0s linear 120ms;
  }
  html:not([data-motion="off"]) .nav__item:is(:hover, :focus-within) > .nav__menu {
    transition: opacity var(--m-panel) var(--m-ease) 150ms, transform var(--m-panel) var(--m-ease) 150ms, visibility 0s linear 150ms;
  }
  /* .m-menu-open comes on when the first panel starts to show (150ms): from then the next word swaps
     the panel at once. Duration and delay go to 0, the properties stay listed, so the panel that is
     still fading in finishes its own 200ms instead of snapping */
  html:not([data-motion="off"]) .nav.m-menu-open .nav__menu,
  html:not([data-motion="off"]) .nav.m-menu-open .nav__item:is(:hover, :focus-within) > .nav__menu { transition-duration: 0s; transition-delay: 0s; }
  html:not([data-motion="off"]) .nav__menu .grid > * { opacity: 0; transform: translateY(4px); transition: opacity 100ms var(--m-ease), transform 100ms var(--m-ease); }
  html:not([data-motion="off"]) .nav__item:is(:hover, :focus-within) > .nav__menu .grid > * {
    opacity: 1; transform: none; transition: opacity 260ms var(--m-ease), transform 260ms var(--m-ease);
    transition-delay: calc(170ms + var(--m-i, 0) * 30ms);
  }
  html:not([data-motion="off"]) .nav.m-menu-open .nav__item:is(:hover, :focus-within) > .nav__menu .grid > * { transition-delay: calc(var(--m-i, 0) * 30ms); }
  html:not([data-motion="off"]) .nav__menu .grid > :nth-child(2) { --m-i: 1; }
  html:not([data-motion="off"]) .nav__menu .grid > :nth-child(3) { --m-i: 2; }
  html:not([data-motion="off"]) .nav__menu .grid > :nth-child(4) { --m-i: 3; }
  html:not([data-motion="off"]) .nav__menu .grid > :nth-child(n + 5) { --m-i: 4; }
  html:not([data-motion="off"]) .menu-col a { transition: color var(--m-out) var(--m-ease); }
  html:not([data-motion="off"]) .menu-col a:hover { transition-duration: var(--m-in); }
  html:not([data-motion="off"]) .menu-card .panel { transition: border-color var(--m-out) var(--m-ease); }
}
/* the phone sheet slides in 8px and fades (system.js opens it) */
@media (max-width: 1023px) {
  html:not([data-motion="off"]) .nav.is-open .nav__links { transition: opacity var(--m-panel) var(--m-ease), transform var(--m-panel) var(--m-ease); }
  @starting-style { html:not([data-motion="off"]) .nav.is-open .nav__links { opacity: 0; transform: translateY(-8px); } }
}

/* ---------------------------------------------------------------- tabs: the indicator slides */
html:not([data-motion="off"]) .tabs.m-has-ind { position: relative; isolation: isolate; }
html:not([data-motion="off"]) .tabs.m-has-ind .tab { position: relative; z-index: 1; }
html:not([data-motion="off"]) .tabs.m-has-ind .tab[aria-selected="true"] { background: transparent; border-color: transparent; }
.m-tab-ind {
  position: absolute; left: 0; top: 0; z-index: 0; width: var(--w, 0px); height: var(--h, 0px);
  border-radius: var(--r-btn); background: var(--ink); pointer-events: none;
  transform: translate(var(--x, 0px), var(--y, 0px));
  transition: transform var(--m-slide) var(--m-ease-io), width var(--m-slide) var(--m-ease-io), height var(--m-slide) var(--m-ease-io);
}
.m-tab-ind.is-jump { transition: none; }
html:not([data-motion="off"]) .tab { transition: color var(--m-slide) var(--m-ease), border-color var(--m-out) var(--m-ease), background-color var(--m-out) var(--m-ease); }

/* ---------------------------------------------------------------- focus: the ring settles in */
/* only on the plain controls, never on a part of a loop, and not on an element that runs its own
   animation (mark it .m-anim): an animation set here would replace that element's own */
html:not([data-motion="off"]) :is(a, button, input, select, textarea, summary, [tabindex]):focus-visible:not([data-m-loop] *, .m-anim, .loop-pause) {
  animation: m-focus var(--m-out) var(--m-ease);
}
@keyframes m-focus { from { outline-offset: 6px; outline-color: transparent; } }

/* ---------------------------------------------------------------- cards: a 2px lift */
/* the card rises 2px, its border and shadow deepen; a card without its own box (.card--open) lifts
   its panel. Never tilts, flips or follows the pointer */
html:not([data-motion="off"]) .card:not(.card--open, .card--plan) {
  transition: transform var(--m-out) var(--m-ease), border-color var(--m-out) var(--m-ease), box-shadow var(--m-out) var(--m-ease);
}
html:not([data-motion="off"]) .card--open > .panel { transition: transform var(--m-out) var(--m-ease), box-shadow var(--m-out) var(--m-ease); }
@media (hover: hover) and (pointer: fine) {
  html:not([data-motion="off"]) .card:not(.card--open, .card--plan, .m-nolift):hover {
    transform: translateY(var(--m-lift));
    border-color: color-mix(in oklab, var(--ink) 16%, transparent);
    /* the shadow is deeper on a dark card (its lightness l): about .2 on white, .64 on near-black */
    box-shadow: inset 0 1px 0 var(--c-hi, transparent), 0 1px 2px rgb(0 0 0 / .06),
                0 14px 32px -18px oklch(from var(--card, #fff) 0 0 0 / calc(0.75 - l * 0.55));
    transition-duration: 180ms;
  }
  html:not([data-motion="off"]) .card--open:not(.m-nolift):hover > .panel {
    transform: translateY(var(--m-lift)); box-shadow: 0 14px 32px -18px oklch(from var(--bg, #fff) 0 0 0 / calc(0.75 - l * 0.55)); transition-duration: 180ms;
  }
}

/* ---------------------------------------------------------------- photographs: 1.03 inside the mask */
/* a photograph in a link or a linked card grows 3% inside its own mask (the frame, the tile, a .m-zoom wrapper);
   the mask clips it, so the box never moves. .m-zoom is the hook for any other photograph: wrap it. */
.m-zoom { overflow: clip; }
html:not([data-motion="off"]) :is(.frame__img, .tile__media > img, .m-zoom img, .m-zoom > video) {
  transition: transform var(--m-image) var(--m-ease);

function rows(a){return a.length?a.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{const c=categories.find(c=>c.id===x.cat);return '<button class="row" onclick="selectedEntry='+x.id+';go(\'detail\')"><span class="icon">'+icon(c?.icon||'other')+'</span><span class="label"><b>'+esc(x.note||c?.name||'Sans note')+'</b><small>'+esc(c?.name||'Sans catégorie')+' · '+x.date.slice(8)+'/'+x.date.slice(5,7)+'</small></span><span class="amount '+(x.amount<0?'positive':'')+'">'+(x.amount<0?'+':'−')+money(Math.abs(x.amount))+'</span></button>'}).join(''):'<div class="empty">'+icon('wallet')+'<h2>Aucune opération</h2><p class="hint">Vos opérations apparaîtront ici.</p>'+button('Ajouter une opération','editEntry()')+'</div>'}
function go(p){page=p;$('toast').textContent='';const auth=['login','code','google'].includes(p);$('context').style.display=auth?'none':'flex';$('context').innerHTML='<select aria-label="Projet actif" onchange="projectId=Number(this.value);go(page)">'+options(projects.map(x=>[x.id,x.name]),projectId)+'</select>'+(['home','activity','stats'].includes(p)?'<select aria-label="Période" onchange="changePeriod(this.value)">'+options([['month','Novembre 2026'],['last','Octobre 2026'],['year','Année 2026'],['all','Toutes les dates'],['custom','Personnalisée']],period)+'</select>':'<span class="sync">Démo locale</span>');$('nav').style.display=auth?'none':'flex';$('nav').innerHTML=[['home','Accueil'],['activity','Activité'],['stats','Analyse'],['projects','Projets']].map(([id,label])=>'<button '+(id===p?'aria-current="page"':'')+' class="'+(id===p?'active':'')+'" onclick="go(\''+id+'\')">'+icon(id)+'<span>'+label+'</span></button>').join('');$('main').innerHTML=render(p);$('main').scrollTop=0;if(p==='activity')searchRows();}
function changePeriod(p){period=p;if(p==='custom')go('range');else go(page)}
function render(p){const {income,expense}=sums(),remaining=income-expense;
if(p==='home')return title('Vue d’ensemble',button('＋ Ajouter','editEntry()'))+'<div class="overview"><div class="eyebrow">Solde de la période</div><div class="money">'+new Intl.NumberFormat('fr-FR').format(remaining)+' <span>'+({MGA:'Ar',EUR:'€',USD:'$'}[currency]||esc(currency))+'</span></div><div class="balance-foot">Revenus moins dépenses · '+esc(currentProject().name)+'</div><div class="flows"><div class="flow"><span>↙ Revenus</span><b class="positive">+'+money(income)+'</b></div><div class="flow"><span>↗ Dépenses</span><b>−'+money(expense)+'</b></div></div></div><div class="monthstrip"><div class="segments" aria-hidden="true">'+Array.from({length:20},(_,i)=>'<i class="'+(i<Math.min(20,Math.ceil(income?expense/income*20:0))?'used':'')+'"></i>').join('')+'</div><p>'+(income?'<b>'+Math.round(expense/income*100)+' %</b> des revenus utilisés.<br>'+money(remaining)+' restants.':'Ajoutez un revenu pour suivre votre rythme.')+'</p></div><div class="heading"><h2>Dernières opérations</h2>'+button('Tout voir ↗',"go('activity')",'textbtn')+'</div>'+rows(dataInPeriod().slice(0,4))+'<div class="heading"><h2>Dépenses journalières</h2>'+button('Analyse ↗',"go('stats')",'textbtn')+'</div>'+dailyChart()+button('Gérer mes catégories',"go('categories')",'textbtn');
if(p==='activity')return title('Opérations',button('＋ Ajouter','editEntry()'))+'<div class="actionrow">'+button('Filtres'+(Object.values(filters).some(Boolean)?' •':''),"go('filters')",'secondary')+button('Catégories',"go('categories')",'secondary')+'</div><input class="search" aria-label="Rechercher" placeholder="Rechercher une opération" value="'+esc(query)+'" oninput="query=this.value;searchRows()"><div class="chips">'+[['all','Tout'],['expense','Dépenses'],['income','Revenus']].map(([v,l])=>button(l,"kind='"+v+"';go('activity')",kind===v?'active':'')).join('')+'</div><div id="results"></div>';
if(p==='entry'){const x=entries.find(x=>x.id===editing);return back(x?'detail':'activity')+title(x?'Modifier l’opération':'Nouvelle opération')+'<form onsubmit="saveEntry(event)">'+select('Type','entryType',[['expense','Dépense'],['income','Revenu']],x?.amount<0?'income':'expense')+field('Montant · '+esc(currency),'amount','number',x?Math.abs(x.amount):'','required min="0.01" max="1000000000" step="0.01" inputmode="decimal" style="font-size:32px"')+select('Catégorie','cat',[[0,'Sans catégorie'],...categories.map(c=>[c.id,c.name])],x?.cat||1)+button('＋ Créer une catégorie',"selectedCategory=null;go('category')",'textbtn')+select('Projet','entryProject',projects.map(x=>[x.id,x.name]),x?.project??projectId)+field('Date','entryDate','date',x?.date||'2026-11-05','required')+'<label for="entryNote">Note</label><textarea id="entryNote" maxlength="200" placeholder="À quoi correspond cette opération ?">'+esc(x?.note||'')+'</textarea><button class="primary full">Enregistrer</button></form>'}
if(p==='detail'){const x=entries.find(x=>x.id===selectedEntry);if(!x)return back('activity')+title('Opération supprimée');const c=categories.find(c=>c.id===x.cat);return back('activity')+title(x.amount<0?'Revenu':'Dépense')+'<div class="statnum">'+(x.amount<0?'+':'−')+money(Math.abs(x.amount))+'</div>'+detailLine('Note',x.note||'Aucune note')+detailLine('Catégorie',c?.name||'Sans catégorie')+detailLine('Date',x.date)+detailLine('Créée par',x.creator)+detailLine('Projet',projects.find(p=>p.id===x.project)?.name||'Personnel')+(canEdit(x)?button('Modifier',`editEntry(${x.id})`,'primary full')+button('Supprimer',`deleteEntry(${x.id})`,'secondary full danger'):'<p class="notice">Lecture seule. Seuls le créateur et le propriétaire du projet peuvent modifier cette opération.</p>')}
if(p==='filters')return back('activity')+title('Filtrer les opérations')+'<form onsubmit="applyFilters(event)"><div class="two">'+field('Du','from','date',filters.from)+field('Au','to','date',filters.to)+'</div><div class="two">'+field('Minimum','min','number',filters.min,'min="0" step="0.01"')+field('Maximum','max','number',filters.max,'min="0" step="0.01"')+'</div><p class="error" id="formError"></p><button class="primary full">Appliquer les filtres</button></form>'+button('Réinitialiser',"filters={from:'',to:'',min:'',max:''};go('activity')",'secondary full');
if(p==='range')return back('stats')+title('Période personnalisée')+'<form onsubmit="saveRange(event)">'+field('Du','rangeFrom','date',range.from,'required')+field('Au','rangeTo','date',range.to,'required')+'<p class="error" id="formError"></p><button class="primary full">Afficher cette période</button></form>';
if(p==='stats')return title('Analyse')+'<p class="intro">'+esc(currentProject().name)+' · '+dataInPeriod().length+' opérations</p><div class="eyebrow">Total dépensé</div><div class="statnum">'+money(expense)+'</div><div class="statpair"><div><small>Revenus</small><b class="positive">'+money(income)+'</b></div><div><small>Solde</small><b>'+money(remaining)+'</b></div></div><div class="heading"><h2>Par catégorie</h2></div>'+categoryChart()+'<div class="heading"><h2>Revenus et dépenses</h2></div>'+monthlyChart()+'<div class="heading"><h2>Au fil des jours</h2></div>'+dailyChart();
if(p==='projects')return title('Projets',button('＋ Créer',"selectedProject=null;go('projectForm')"))+'<p class="intro">Un espace pour chaque projet, seul ou à plusieurs.</p>'+projects.map(x=>'<button class="row" onclick="selectedProject='+x.id+';go(\'project\')"><span class="icon">'+icon('projects')+'</span><span class="label"><b>'+esc(x.name)+'</b><small>'+esc(x.description)+'</small></span><span class="badge">'+(x.id===projectId?'Actif':x.owner?'Propriétaire':'Membre')+'</span></button>').join('');
if(p==='project'){const x=projects.find(p=>p.id===selectedProject);return back('projects')+title(esc(x.name))+'<p class="intro">'+esc(x.description)+'</p>'+button(x.id===projectId?'Ouvrir cet espace':'Utiliser ce projet',`projectId=${x.id};go('home')`,'primary full')+(x.id===0?button('Convertir en projet',"go('convert')",'secondary full'):'<div class="section-label">GESTION DU PROJET</div>'+button('Membres et invitations →',"go('members')",'settings')+(x.owner?button('Modifier le projet',"go('projectForm')",'settings')+button('Supprimer le projet','deleteProject()','settings danger'):'<p class="notice">Vous êtes membre de ce projet. La gestion du projet est réservée à son propriétaire.</p>'))}
if(p==='projectForm'||p==='convert'){const x=projects.find(p=>p.id===selectedProject);return back('projects')+title(p==='convert'?'Créer un projet':x?'Modifier le projet':'Nouveau projet')+(p==='convert'?'<p class="intro">Toutes vos opérations personnelles seront déplacées dans ce nouveau projet.</p>':'')+'<form onsubmit="saveProject(event,'+(p==='convert')+')">'+field('Nom du projet','projectName','text',p==='convert'?'':x?.name||'','required minlength="2" maxlength="50"')+'<label for="projectDescription">Description</label><textarea id="projectDescription" maxlength="180">'+esc(p==='convert'?'':x?.description||'')+'</textarea><button class="primary full">'+(p==='convert'?'Créer et déplacer les opérations':'Enregistrer le projet')+'</button></form>'}
if(p==='members'){const proj=projects.find(p=>p.id===selectedProject);return back('project')+title('Membres')+'<p class="intro">'+esc(proj.name)+'</p><div class="row"><span class="avatar icon">'+(proj.owner?'TS':'L')+'</span><span class="label"><b>'+(proj.owner?esc(profile):'Léa')+'</b><small>Propriétaire</small></span></div>'+members.filter(x=>x.project===selectedProject&&x.status!=='Propriétaire').map(x=>'<div class="row"><span class="label"><b>'+esc(x.name)+'</b><small>'+esc(x.email)+' · '+x.status+'</small></span>'+(proj.owner||x.removable?button('Retirer',`removeMember(${x.id})`,'textbtn danger'):'')+'</div>').join('')+'<div class="heading"><h2>Inviter une personne</h2></div><p class="hint">Recherche dans les profils de démonstration.</p><input class="search" id="memberSearch" placeholder="Nom ou e-mail : Alex, Sam…" aria-label="Rechercher un membre" oninput="searchMembers(this.value)"><div id="memberResults"></div>'+(!proj.owner?button('Quitter le projet','leaveProject()','secondary full danger'):'')}
if(p==='categories')return back('activity')+title('Catégories',button('＋ Créer',"selectedCategory=null;go('category')"))+categories.map(c=>'<button class="row" onclick="selectedCategory='+c.id+';go(\'category\')"><span class="icon">'+icon(c.icon)+'</span><span class="label"><b>'+esc(c.name)+'</b><small>'+entries.filter(x=>x.cat===c.id).length+' opérations</small></span><span class="swatch" style="background:'+c.color+'"></span><span>›</span></button>').join('');
if(p==='category'){const c=categories.find(c=>c.id===selectedCategory);return back('categories')+title(c?'Modifier la catégorie':'Nouvelle catégorie')+'<form onsubmit="saveCategory(event)">'+field('Nom','categoryName','text',c?.name||'','required minlength="2" maxlength="40"')+select('Icône','categoryIcon',[['food','Alimentation'],['car','Transport'],['home','Maison'],['wallet','Shopping'],['health','Santé'],['education','Éducation'],['entertainment','Loisirs'],['other','Autre']],c?.icon||'other')+field('Couleur','categoryColor','color',c?.color||'#3ecf8e')+'<button class="primary full">Enregistrer la catégorie</button></form>'+(c?button('Supprimer la catégorie','deleteCategory()','secondary full danger'):'')}
if(p==='account')return title('Mon compte')+'<div class="row"><span class="avatar icon">TS</span><span class="label"><b>'+esc(profile)+'</b><small>'+esc(email)+'</small></span></div><div class="section-label">PROFIL</div>'+button('Modifier mon profil →',"go('profile')",'settings')+button('Préférences →',"go('settings')",'settings')+'<div class="section-label">ORGANISATION</div>'+button('Mes projets →',"go('projects')",'settings')+button('Mes catégories →',"go('categories')",'settings')+'<div class="section-label">SESSION</div>'+detailLine('Connexion','Code e-mail ou Google')+button('Se déconnecter',"confirmAction('Se déconnecter ?','Vous pourrez revenir avec votre adresse e-mail.',()=>{authenticated=false;go('login')})",'settings danger');

if(p==='settings')return back('account')+title('Préférences')+'<div class="section-label">APPARENCE</div><p class="hint">Thème de l’application</p><div class="switches">'+[['light','Clair'],['dark','Sombre'],['system','Système']].map(([v,l])=>button(l,`setTheme('${v}')`,theme===v?'active':'')).join('')+'</div><div class="section-label">LOCALISATION</div>'+button('Langue <span>'+({fr:'Français',en:'English',system:'Système'}[language])+' ›</span>',"go('language')",'settings')+button('Devise <span>'+esc(currency)+' ›</span>',"go('currency')",'settings')+'<div class="section-label">DONNÉES</div>'+button('Réinitialiser les données locales','resetData()','settings danger')+'<p class="notice">Les modifications restent dans cette maquette. Recharger le fichier rétablit les exemples.</p>';
if(p==='language')return back('settings')+title('Langue')+'<div class="switches">'+[['fr','Français'],['en','English'],['system','Système']].map(([v,l])=>button(l,`language='${v}';go('language')`,language===v?'active':'')).join('')+'</div><p class="notice">Sélection simulée. Les écrans de cette étude sont présentés en français ; la version Flutter conserve ses traductions français et anglais.</p>';
if(p==='currency')return back('settings')+title('Devise')+'<form onsubmit="saveCurrency(event)">'+field('Code de devise','currencyCode','text',currency,'required pattern="[A-Za-z]{3}" maxlength="3"')+'<p class="hint">MGA, EUR, USD… Ce réglage change l’affichage, sans conversion des montants.</p><button class="primary full">Enregistrer</button></form>';

function searchRows(){const a=dataInPeriod().filter(x=>(kind==='all'||(kind==='expense'?x.amount>0:x.amount<0))&&x.note.toLowerCase().includes(query.toLowerCase())&&(!filters.from||x.date>=filters.from)&&(!filters.to||x.date<=filters.to)&&(filters.min===''||Math.abs(x.amount)>=Number(filters.min))&&(filters.max===''||Math.abs(x.amount)<=Number(filters.max)));$('results').innerHTML=rows(a)}
function editEntry(id=null){editing=id;if(id){selectedEntry=id;if(!canEdit(entries.find(x=>x.id===id)))return}go('entry')}
function saveEntry(e){e.preventDefault();const a=Number($('amount').value);if(!Number.isFinite(a)||a<=0)return;const x={id:editing||Date.now(),note:$('entryNote').value.trim(),cat:Number($('cat').value),amount:$('entryType').value==='income'?-a:a,date:$('entryDate').value,project:Number($('entryProject').value),creator:editing?entries.find(x=>x.id===editing).creator:'Vous'};if(editing&&!canEdit(entries.find(x=>x.id===editing)))return;if(editing)entries=entries.map(v=>v.id===editing?x:v);else entries.unshift(x);projectId=x.project;period='all';query='';kind='all';filters={from:'',to:'',min:'',max:''};go('activity');notify('Opération enregistrée dans la démo.')}
function deleteEntry(id){const x=entries.find(x=>x.id===id);if(!canEdit(x))return;confirmAction('Supprimer cette opération ?', 'Cette opération sera retirée de la maquette.',()=>{entries=entries.filter(x=>x.id!==id);go('activity');notify('Opération supprimée.')})}
function applyFilters(e){e.preventDefault();const v=Object.fromEntries(['from','to','min','max'].map(k=>[k,$(k).value]));if((v.from&&v.to&&v.from>v.to)||(v.min!==''&&v.max!==''&&Number(v.min)>Number(v.max))){$('formError').textContent='La borne de début doit être inférieure à celle de fin.';return}filters=v;go('activity')}
function saveRange(e){e.preventDefault();if($('rangeFrom').value>$('rangeTo').value){$('formError').textContent='La date de début doit précéder la date de fin.';return}range={from:$('rangeFrom').value,to:$('rangeTo').value};period='custom';go('stats')}
function categoryChart(){const a=dataInPeriod().filter(x=>x.amount>0),total=sums(a).expense;if(!total)return '<p class="hint">Aucune dépense sur cette période.</p>';return [...categories,{id:0,name:'Sans catégorie'}].map(c=>{const n=a.filter(x=>x.cat===c.id).reduce((s,x)=>s+x.amount,0);return n?'<div class="heading"><span>'+esc(c.name)+'</span><span class="amount">'+money(n)+' · '+Math.round(n/total*100)+' %</span></div><div class="progress"><span style="width:'+n/total*100+'%"></span></div>':''}).join('')}
function monthlyChart(){const months=[...new Set(dataInPeriod().map(x=>x.date.slice(0,7)))].sort(),a=months.map(m=>sums(dataInPeriod().filter(x=>x.date.startsWith(m)))),max=Math.max(1,...a.flatMap(x=>[x.income,x.expense]));return '<div class="chart" role="img" aria-label="Revenus et dépenses des mois présents dans la période sélectionnée">'+a.map((x,i)=>'<div class="column"><div class="pair" title="'+money(x.income)+' de revenus ; '+money(x.expense)+' de dépenses"><i style="height:'+x.income/max*100+'px"></i><i class="out" style="height:'+x.expense/max*100+'px"></i></div>'+new Date(months[i]+'-15T12:00:00').toLocaleDateString('fr-FR',{month:'short',year:'2-digit'})+'</div>').join('')+'</div><div class="legend"><span><i></i>Revenus</span><span><i class="out"></i>Dépenses</span></div>'}
function dailyChart(){const grouped=new Map();dataInPeriod().filter(x=>x.amount>0).forEach(x=>grouped.set(x.date,(grouped.get(x.date)||0)+x.amount));const a=[...grouped].sort((a,b)=>a[0].localeCompare(b[0])).slice(-7),max=Math.max(1,...a.map(x=>x[1]));return a.length?'<div class="chart" role="img" aria-label="Dépenses par jour : '+a.map(([d,n])=>d+' : '+money(n)).join('; ')+'">'+a.map(([d,n])=>'<div class="column"><div class="pair" title="'+money(n)+'"><i style="height:'+n/max*100+'px;width:22px"></i></div>'+d.slice(8)+'/'+d.slice(5,7)+'</div>').join('')+'</div>':'<p class="hint">Aucune dépense sur cette période.</p>'}
function saveCategory(e){e.preventDefault();const c={id:selectedCategory||Date.now(),name:$('categoryName').value.trim(),icon:$('categoryIcon').value,color:$('categoryColor').value};if(c.name.length<2)return;if(selectedCategory)categories=categories.map(x=>x.id===selectedCategory?c:x);else categories.push(c);go('categories');notify('Catégorie enregistrée.')}
function deleteCategory(){confirmAction('Supprimer la catégorie ?','Les opérations associées seront conservées sans catégorie.',()=>{entries.forEach(x=>{if(x.cat===selectedCategory)x.cat=0});categories=categories.filter(x=>x.id!==selectedCategory);go('categories')})}
function saveProject(e,convert){e.preventDefault();const name=$('projectName').value.trim(),description=$('projectDescription').value.trim();if(name.length<2)return;const id=convert||selectedProject===null?Date.now():selectedProject;if(!convert&&selectedProject!==null&&!projects.find(p=>p.id===id)?.owner)return;if(convert||selectedProject===null)projects.push({id,name,description,owner:true});else projects=projects.map(x=>x.id===id?{...x,name,description}:x);if(convert)entries.forEach(x=>{if(x.project===0)x.project=id});selectedProject=id;projectId=id;go('project');notify(convert?'Projet créé, opérations personnelles déplacées.':'Projet enregistré.')}
function deleteProject(){const x=projects.find(x=>x.id===selectedProject);if(!x?.owner||x.id===0)return;confirmAction('Supprimer ce projet ?','Dans la maquette, ses opérations seront conservées dans votre espace personnel.',()=>{entries.forEach(e=>{if(e.project===x.id)e.project=0});members=members.filter(m=>m.project!==x.id);projects=projects.filter(p=>p.id!==x.id);if(projectId===x.id)projectId=0;go('projects')})}
const profiles=[{name:'Alex',email:'alex@example.com'},{name:'Sam',email:'sam@example.com'}];
function searchMembers(q){$('memberResults').innerHTML=q.trim().length<2?'':profiles.filter(x=>(x.name+' '+x.email).toLowerCase().includes(q.toLowerCase())).map(x=>{const i=profiles.indexOf(x),already=members.some(m=>m.project===selectedProject&&m.email===x.email);return '<div class="row"><span class="label"><b>'+x.name+'</b><small>'+x.email+'</small></span>'+(already?'<span class="badge">Déjà invité</span>':button('Inviter',`inviteMember(${i})`,'textbtn'))+'</div>'}).join('')||'<p class="hint">Aucun profil trouvé.</p>'}
function inviteMember(i){const x=profiles[i];if(members.some(m=>m.project===selectedProject&&m.email===x.email))return;members.push({...x,id:Date.now(),project:selectedProject,status:'En attente',removable:true});go('members');notify('Invitation simulée. Aucun message envoyé.')}
function removeMember(id){confirmAction('Retirer ce membre ?','Il ne fera plus partie de ce projet dans la maquette.',()=>{members=members.filter(x=>x.id!==id);go('members')})}
function leaveProject(){confirmAction('Quitter ce projet ?','Vous perdrez l’accès à ce projet dans la maquette.',()=>{projects=projects.filter(x=>x.id!==selectedProject);projectId=0;go('projects')})}
function resetData(){confirmAction('Réinitialiser la démo ?','Les opérations, catégories et projets de cette session seront effacés. Rechargez le fichier pour retrouver les exemples.',()=>{entries=[];categories=[];projects=[{id:0,name:'Personnel',description:'Votre espace privé',owner:true}];members=[];projectId=0;go('home');notify('Données de démonstration réinitialisées.')})}
function saveProfile(e){e.preventDefault();profile=$('profileName').value.trim()||profile;go('account');notify('Profil mis à jour dans la démo.')}
function saveCurrency(e){e.preventDefault();currency=$('currencyCode').value.trim().toUpperCase();go('settings')}
function sendCode(e){e.preventDefault();email=$('loginEmail').value.trim();authenticated=false;go('code')}
function verifyCode(e){e.preventDefault();if($('otp').value!=='123456'){$('authError').textContent='Code incorrect ou expiré. Réessayez avec 123456.';return}authenticated=true;go('home');notify('Connexion simulée réussie.')}
console.assert(sums().income===2400000&&sums().expense===525000,'Demo totals');console.assert(!canEdit(entries.find(x=>x.id===7)),'Read-only project');console.assert(esc('<test>')==='&lt;test&gt;','Escaping');
setTheme('light');go('home');
</script></body></html>
